[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slap2-processing-library"
description = "SLAP2 processing library: motion correction, source extraction, QC, and NWB packaging for SLAP2 two-photon imaging"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Neural Dynamics accelerator at the Allen Institute"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.0.0"

dependencies = [
    "aind-data-schema>=2.9.1,<3",
    "h5py>=3.11,<4",
    "numpy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
slap2 = "slap2_processing_library.cli:main"
slap2-motion-correction = "slap2_processing_library.motion_correction.job:main"
slap2-source-extraction = "slap2_processing_library.source_extraction.job:main"
slap2-qc = "slap2_processing_library.qc.job:main"
slap2-nwb = "slap2_processing_library.nwb.job:main"

[dependency-groups]
dev = [
    "ruff>=0.15.20,<1.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "interrogate>=1.7.0,<2.0.0"
]
docs = [
    "Sphinx>=9.1.0,<10.0.0",
    "furo==2025.12.19"
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.hatch.build.targets.wheel]
packages = ["src/slap2_processing_library"]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--strict-markers",
    "-m",
    "not data",
]
markers = [
    "data: needs the reference SLAP2 datasets mounted from Code Ocean or S3",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.ruff]
preview = true
src = ["src", "tests"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "docs"
]
line-length = 100

[tool.ruff.lint]
select = ["I", "E", "F", "W", "ANN", "W505", "D", "DOC", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.interrogate]
ignore-init-methods = true
ignore-init-module = true
exclude = ["docs", "build", ".conda", ".venv", "env"]
fail-under = 100

